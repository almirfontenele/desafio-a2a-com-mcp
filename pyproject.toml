[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio-a2a-com-mcp"
version = "1.0.0"
description = "A Ponte: Agente A2A com MCP por dentro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "uvicorn[standard]==0.54.0",
    "fastapi==0.115.0",
    "starlette==0.38.6",
    "requests==2.32.3",
    "httpx==0.27.2",
    "aiohttp==3.10.5",
    "pydantic==2.14.1"
]

[tool.setuptools]
packages = ["agente", "validador"]
